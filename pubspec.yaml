name: campus_subsystem
description: A new Flutter project.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=2.17.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase packages
  firebase_core: ^2.32.0
  firebase_auth: ^4.17.8
  cloud_firestore: ^4.15.8
  firebase_storage: ^11.7.6
  firebase_messaging: ^14.7.21
  firebase_analytics: ^10.8.7
  flutter_local_notifications: ^16.3.3

  # Common utilities
  provider: ^6.1.2
  http: ^1.2.1
  dio: ^5.4.1
  path_provider: ^2.1.3
  url_launcher: ^6.2.5
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  image_picker: ^1.1.0
  file_picker: ^6.1.1
  open_file_plus: ^3.4.1
  emoji_picker_flutter: ^2.2.0
  excel: ^4.0.2

  # UI and design
  cupertino_icons: ^1.0.6
  flutter_speed_dial: ^7.0.0
  curved_navigation_bar: ^1.0.3
  loading_animation_widget: ^1.2.0+4
  flutter_slidable: ^3.0.1
  pie_chart: ^5.3.2
  percent_indicator: ^4.2.3

  # State management
  flutter_hooks: ^0.20.4
  flutter_redux: ^0.10.0
  redux_thunk: ^0.4.0

  # Device/OS integrations
  permission_handler: ^11.3.1
  connectivity: ^3.0.6
  internet_connection_checker: ^1.0.0+1
  keyboard_visibility_pro: ^0.0.1
  flutter_keyboard_visibility: ^5.4.1

  # Other
  easy_pdf_viewer: ^1.0.7
  multiselect_scope: ^0.2.0
  googleapis_auth: ^1.4.0
  googleapis: ^11.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter_icons:
  android: true
  image_path: "assets/images/launcher_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Custom
      fonts:
        - asset: assets/fonts/BubblegumSans.ttf

    - family: Sticky
      fonts:
        - asset: assets/fonts/StickNoBills-VariableFont_wght.ttf

    - family: Bold
      fonts:
        - asset: assets/fonts/BebasNeue-Regular.ttf

    - family: Narrow
      fonts:
        - asset: assets/fonts/PTSansNarrow-Bold.ttf

    - family: Muli
      fonts:
        - asset: assets/fonts/Muli.ttf

    - family: MuliBold
      fonts:
        - asset: assets/fonts/Muli-Bold.ttf
